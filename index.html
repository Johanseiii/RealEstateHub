<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a0a;--card:#151312;--tx:#f5f2ef;--mut:#a39a93;--bd:#2b2623;--ov:rgba(8,7,7,.78);--p1:#1c1816;--p2:#141110}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.top{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;display:flex;gap:8px;align-items:center;background:rgba(8,10,16,.62);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08);color:#fff}
.top>*{pointer-events:auto}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:#fff;border:1px solid var(--acc);padding:13px 20px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:0 0 28px rgba(244,72,15,.35)}
.btn.alt{background:rgba(20,17,16,.55);color:var(--tx);border-color:var(--bd);box-shadow:none;backdrop-filter:blur(6px)}

.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.top .btn{padding:10px 16px;font-size:14px}
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 20px 70px;overflow:hidden}
.panels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr)}
.panels div{background:linear-gradient(180deg,var(--p1),var(--p2));border-right:1px solid var(--bd)}
.panels div:nth-child(even){background:linear-gradient(180deg,var(--p2),var(--p1))}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(5,7,14,.6) 0%,rgba(5,7,14,.12) 75%);z-index:1}
.hero>*:not(.sky){position:relative;z-index:2}
.logo{width:150px;height:150px;filter:drop-shadow(0 0 26px rgba(244,72,15,.65));margin-bottom:6px}
h1{font-size:clamp(44px,9vw,92px);line-height:1;letter-spacing:-.045em;font-weight:900;margin:8px 0 18px}
.sub{max-width:600px;color:var(--tx);opacity:.85;font-size:17px;margin:0 0 30px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.foot{position:absolute!important;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:11px;letter-spacing:.28em;color:var(--mut)}
.page{max-width:1000px;margin:0 auto;padding:calc(84px + env(safe-area-inset-top,0px)) 20px 60px}
.page>h2:first-child{margin-top:0;font-size:32px;letter-spacing:-.03em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.card h3{margin:8px 0 4px;font-size:16px}.mut{color:var(--mut)}.price{font-weight:800;font-size:18px;color:var(--acc)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);margin-right:4px}
.sold{opacity:.55}
h2{margin:32px 0 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.bar button{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit}
.bar button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
form{max-width:480px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat b{display:block;font-size:28px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.mapwrap,.mini{position:relative;background:var(--map) center/100% 100% no-repeat #5f7b8e;aspect-ratio:1027/689;border-radius:12px;border:1px solid var(--bd);overflow:hidden}
.mapwrap{cursor:crosshair;max-width:100%;background:#5f7b8e;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.mapin{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;background:var(--map) center/100% 100% no-repeat #5f7b8e;will-change:transform}

.mini{margin-top:10px;border-radius:8px}

.hero{color:#fff;background:linear-gradient(180deg,#070b16 0%,#18203a 42%,#5a2d3c 74%,#e2561d 100%)}

function thread(id,o){if(o){openT.add(id);const un=msgs.filter(m=>m.request_id==id&&m.sender=="player"&&!m.read_by_staff);if(un.length){un.forEach(m=>m.read_by_staff=true);sb("/rest/v1/messages?request_id=eq."+id+"&sender=eq.player&read_by_staff=eq.false",{m:"PATCH",b:{read_by_staff:true}},1).catch(()=>{});const d=$("#dstats");if(d)d.innerHTML=statsHtml()}}else openT.delete(id)}

async function setSt(id,x){const q=inq.find(z=>z.id==id),nm=q?q.n:"";try{if(x=="Denied")await sb("/rest/v1/requests?id=eq."+id,{m:"PATCH",b:{status:"denied"}},1);else await sb("/rest/v1/requests?id=eq."+id,{m:"DELETE"},1);await addLog(x=="Denied"?"denied":x=="Done"?"done":"removed",nm,q?q.pl:"")}catch(e){lastErr="That didn't go through. Try again."}await loadReqs()}
function stHtml(r){if(!r)return `<p class="note">No request found for that code. It may have been completed or removed.</p>`;
return `<div class="card" style="max-width:520px"><h3 style="margin-top:0">${esc(r.ic_name||"")}</h3><p class="mut" style="margin:0 0 10px">Status: ${r.status=="denied"?"Denied":"Received"}</p><div style="max-height:260px;overflow:auto">${(r.messages||[]).map(m=>`<div style="margin:4px 0;text-align:${m.sender=="player"?"right":"left"}"><div class="mut" style="font-size:11px">${m.sender=="player"?"You":"Staff"}</div><span class="tag" style="display:inline-block;max-width:90%;white-space:pre-wrap;text-align:left;${m.sender=="player"?"background:var(--acc);color:#fff;border-color:var(--acc)":""}">${esc(m.body)}</span></div>`).join("")||'<p class="note">No messages yet. Staff will message you here if they need anything.</p>'}</div><form onsubmit="return sendMine(event)" style="display:flex;gap:6px;margin-top:10px"><input name="b" required maxlength="2000" aria-label="Message" style="flex:1;min-width:0"><button class="btn sm">Send</button></form></div>`}
async function lookupCode(c){const o=$("#stout");if(!o)return;try{o.innerHTML=stHtml(await sb("/rest/v1/rpc/get_my_request",{m:"POST",b:{c:c.trim()}}))}catch(x){o.innerHTML='<p class="note">Could not check right now. Try again.</p>'}}
function lookup(e){e.preventDefault();const c=e.target.c.value.trim();ls.set("fb_code",c);lookupCode(c);return false}
async function sendMine(e){e.preventDefault();const f=e.target,b=f.b.value.trim(),c=ls.get("fb_code","");if(!b)return false;try{await sb("/rest/v1/rpc/send_player_message",{m:"POST",b:{c,b}});f.reset()}catch(x){}lookupCode(c);return false}
setInterval(()=>{if(staff&&location.hash=="#/staff")loadReqs();else if(location.hash=="#/status"){const c=ls.get("fb_code",""),a=document.activeElement,o=$("#stout");if(c&&!(a&&o&&o.contains(a)&&a.value))lookupCode(c)}},15000);
async function addLog(action,name,details){try{await sb("/rest/v1/logs",{m:"POST",b:{actor:ls.get("fb_name","")||"staff",action,request_name:name||"",details:(details||"").slice(0,300)},h:{Prefer:"return=minimal"}},1)}catch(e){}}
const LBL={request_received:"New request",player_reply:"Player replied",message_sent:"Staff message",denied:"Denied",done:"Marked done",removed:"Removed (undo)",staff_login:"Staff login"};
function logsHtml(){if(!sess||!sess.admin)return "";return `<h2>Logs</h2>${!logsOk?'<p class="note">Logs are not set up yet. Run the logs SQL in Supabase.</p>':`<div class="card tbl" style="max-height:420px;overflow:auto"><table><tr><th>Time</th><th>Who</th><th>Action</th><th>Request</th><th>Details</th></tr>${logs.map(l=>`<tr><td>${new Date(l.created_at).toLocaleString()}</td><td>${esc(l.actor)}</td><td>${LBL[l.action]||esc(l.action)}</td><td>${esc(l.request_name||"")}</td><td style="white-space:normal;min-width:180px">${esc(l.details||"")}</td></tr>`).join("")||'<tr><td colspan="5" class="mut">No activity yet.</td></tr>'}</table></div>`}`}
const lk=(t,u)=>u&&/^https?:\/\//i.test(u)?`<div class="mut">${t}: <a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--acc)">open image</a></div>`:"";
function reqPage(title,intro){return `<div class="page"><a class="mback" href="${from=="map"?"#/map":"#/"}" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></a><h2 style="margin-top:0">${title}</h2><p class="mut">${intro}</p><h2>Your details</h2><form onsubmit="return sendInq(event)" style="max-width:560px"><label>IC Name:</label><input name="n" required><label>Archetype: (Do not lie because we will check)</label><input name="a" required><label>IC Number:</label><input name="ic" required><label>Property Location:</label><input name="pl" required><label>Map Location:</label>${picker()}<label>Outside Image:</label><div class="drop" id="dz" tabindex="0" ondragover="event.preventDefault()" ondrop="dropImg(event)"><div id="dzt">Click here, then press Ctrl+V to paste your screenshot. You can also drag an image in, or <label class="lnk">choose a file<input type="file" accept="image/*" hidden onchange="fileImg(this.files[0])"></label>.</div><img id="dzi" alt="Screenshot preview" style="display:none"></div><label>Interior:</label><input name="ix" required><label>Are you in a faction?</label><select name="fy" onchange="this.form.fn.required=this.value=='Yes';document.getElementById('fnw').style.display=this.value=='Yes'?'block':'none'"><option>No</option><option>Yes</option></select><div id="fnw" style="display:none"><label>Which faction are you in?</label><input name="fn"></div><label>Is this a faction property?</label><select name="fp"><option>No</option><option>Yes</option></select><p><button class="btn">Send</button></p><div id="ok" class="note"></div></form></div>`}
async function sendInq(e){e.preventDefault();const f=e.target,ok=$("#ok");if(!pin){needPin();return false}
if(!shot){ok.textContent="Please add your outside screenshot.";$("#dz").scrollIntoView({block:"center"});return false}
const bt=f.querySelector("button.btn");bt.disabled=true;ok.textContent="Sending...";
try{const code=String(await sb("/rest/v1/rpc/submit_request",{m:"POST",b:{p:{ic_name:f.n.value,archetype:f.a.value,ic_number:f.ic.value,property_location:f.pl.value,map_x:pin.x,map_y:pin.y,outside_image:shot,interior:f.ix.value,in_faction:f.fy.value,faction_name:f.fy.value=="Yes"?f.fn.value:"",faction_property:f.fp.value}}}));
ls.set("fb_code",code);pin=null;shot=null;$("#app").innerHTML=`<div class="page"><h2 style="margin-top:0">Request sent</h2><p>Your request code is:</p><p style="font-size:26px;font-weight:800;letter-spacing:.06em;user-select:all">${esc(code)}</p><p class="mut">Save this code. Use it on the <b>Check my request</b> page to see messages from staff and reply to them.</p><p><a class="btn" href="#/status">Check my request</a></p></div>`;window.scrollTo(0,0)}
catch(x){ok.textContent="Couldn't send your request. Please try again.";bt.disabled=false}return false}
async function login(e){e.preventDefault();const f=e.target,er=$("#err");er.textContent="Logging in...";try{let d=null,adm=false,codes=[];
for(const em of[STAFF_EMAIL,ADMIN_EMAIL]){const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:em,password:f.c.value})});if(r.ok){d=await r.json();adm=em==ADMIN_EMAIL;break}let j={};try{j=await r.json()}catch(_){}codes.push(j.error_code||j.error||String(r.status))}
if(!d){er.textContent=codes.includes("email_not_confirmed")?"That Supabase user is not confirmed. Delete it and create it again with Auto Confirm User turned on.":codes.every(c=>c=="invalid_credentials")?"Wrong password, or the user was not created in Supabase.":"Login problem: "+codes.join(", ");return false}
setSess(d,adm);ls.set("fb_name",f.e.value.trim());addLog("staff_login","",adm?"high rank":"");render()}catch(x){er.textContent="Can't reach the server. Check your connection."}return false}
function logout(){sess=null;staff=false;ls.set("fb_sess",null);inq=[];msgs=[];render()}
function tog(id){const l=listings.find(x=>x.id==id);l.status=l.status=="Sold"?"Available":"Sold";save();render()}
function del(id){listings=listings.filter(x=>x.id!=id);save();render()}
function addL(e){e.preventDefault();const f=e.target;if(!pin){needPin();return false}listings.push({id:Date.now(),name:f.n.value,b:f.b.value,type:f.t.value,price:+f.p.value,beds:+f.r.value,x:pin.x,y:pin.y,status:"Available"});pin=null;save();render();return false}
function flip(){theme=theme=="dark"?"light":"dark";ls.set("fb_theme",theme);render()}
function render(){const r=(location.hash.replace("#/","")||"home");const p=pages[r]?r:"home";
if(p!=lastRoute){if(!(lastRoute=="map"&&p=="apply"))pin=null;shot=null;from=lastRoute;lastRoute=p}
mv={s:1,x:0,y:0};ptrs.clear();g=null;
document.documentElement.setAttribute("data-theme",theme);
$("#top").innerHTML=`<a class="brand" href="#/">FIVE BOROUGHS <b>REALTY</b></a><a class="btn alt hm" href="#/map">Property Map</a><a class="btn alt hm" href="#/pricing">Pricing</a><a class="btn alt hm" href="#/status">My Request</a><a class="btn alt hm" href="#/apply">Contact</a><button class="btn alt" onclick="flip()">${ic("sun")} ${theme=="dark"?"Light mode":"Dark mode"}</button><a class="btn alt" href="#/staff">${ic("grid")} Dashboard</a>`;
$("#top").style.display=p=="map"?"none":"";$("#app").innerHTML=pages[p]();if(p=="map")applyView();if(p=="staff"&&staff)loadReqs();if(p=="status"&&ls.get("fb_code",""))lookupCode(ls.get("fb_code",""));window.scrollTo(0,0)}
addEventListener("resize",()=>{if($("#mw"))applyView()});
addEventListener("hashchange",render);render();
</script></body></html>
